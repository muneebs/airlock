version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    binary: airlock
    ldflags:
      - -s -w -X github.com/muneebs/airlock/cmd/airlock/cli.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  use: github
  abbrev: 7
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
      - "^test:"
      - "merge conflict"
      - "merge branch"
  groups:
    - title: Features
      order: 0
      regexp: '^feat'
    - title: Bug Fixes
      order: 1
      regexp: '^fix'
    - title: Documentation
      order: 2
      regexp: '^docs'
    - title: Refactoring
      order: 3
      regexp: '^refactor'
    - title: Other Changes
      order: 999

release:
  github:
    owner: muneebs
    name: airlock
  # Releases are immutable: assets can only be attached while the release is a
  # draft, so goreleaser must not publish. The workflow flips the draft once
  # every asset is uploaded and attested.
  draft: true
  # header comes from .github/release-header.md via --release-header.
  footer: |-
    ## Verifying this release

    Every archive is signed with a build provenance attestation tied to the
    workflow run that produced it:

    ```sh
    gh attestation verify airlock_{{ .Version }}_darwin_arm64.tar.gz --repo muneebs/airlock
    ```

    `checksums.txt` is attested too, so verifying it covers every archive.

    ## AI transparency

    Releases in this project are AI-assisted. All code in this release was
    reviewed and tested by a human before merge.